
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerNova | Skill Gap Analysis</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
        }

        .skill-nav {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
        }

        .skill-logo {
            color: #4f46e5;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
        }

        .skill-links {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .skill-links a {
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .skill-links a:hover {
            color: #4f46e5;
        }

        .skill-logout {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 10px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .skill-container {
            width: 86%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .skill-header {
            margin-bottom: 28px;
        }

        .skill-eyebrow {
            color: #6366f1;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .skill-header h1 {
            color: #172554;
            font-size: 36px;
            margin: 0;
        }

        .skill-header p {
            color: #64748b;
            font-size: 15px;
            margin-top: 12px;
        }

        .skill-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .skill-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 22px rgba(15, 23, 42, 0.06);
        }

        .skill-card h2 {
            color: #1e293b;
            font-size: 22px;
            margin: 0 0 25px;
        }

        .skill-form label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        .skill-form label:first-child {
            margin-top: 0;
        }

        .skill-form select,
        .skill-form textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #334155;
            background: #ffffff;
            outline: none;
        }

        .skill-form select:focus,
        .skill-form textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .skill-form textarea {
            resize: vertical;
            min-height: 125px;
        }

        .skill-submit {
            width: 100%;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }

        .skill-submit:hover {
            background: #4338ca;
        }

        .skill-result {
            min-height: 280px;
        }

        .skill-result h2 {
            margin-bottom: 15px;
        }

        .skill-result p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        @media (max-width: 800px) {
            .skill-nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .skill-links {
                gap: 14px;
            }

            .skill-container {
                width: 92%;
                margin-top: 30px;
            }

            .skill-layout {
                grid-template-columns: 1fr;
            }

            .skill-header h1 {
                font-size: 29px;
            }
        }
    </style>
</head>
<body>

    <header class="skill-nav">
        <a href="dashboard.html" class="skill-logo">CareerNova</a>

        <nav class="skill-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="career.html">Career</a>
            <a href="profile.html">Profile</a>
            <button id="logoutBtn" class="skill-logout">Logout</button>
        </nav>
    </header>

    <main class="skill-container">
        <section class="skill-header">
            <p class="skill-eyebrow">SKILL DEVELOPMENT</p>
            <h1>Skill Gap Analysis</h1>
            <p>Identify missing skills and improve your placement preparation.</p>
        </section>

        <section class="skill-layout">
            <div class="skill-card">
                <h2>Analyze Your Skills</h2>

                <form id="skillGapForm" class="skill-form">
                    <label for="targetRole">Target Job Role</label>

                    <select id="targetRole" required>
                        <option value="">Select target role</option>
                        <option value="Frontend Developer">Frontend Developer</option>
                        <option value="Backend Developer">Backend Developer</option>
                        <option value="Full Stack Developer">Full Stack Developer</option>
                        <option value="Cloud Engineer">Cloud Engineer</option>
                        <option value="Software Developer">Software Developer</option>
                        <option value="Data Analyst">Data Analyst</option>
                    </select>

                    <label for="currentSkills">Current Skills</label>

                    <textarea id="currentSkills" rows="5" placeholder="Enter skills separated by commas" required></textarea>

                    <label for="skillLevel">Current Skill Level</label>

                    <select id="skillLevel" required>
                        <option value="">Select skill level</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>

                    <button type="submit" class="skill-submit">
                        Analyze Skill Gap
                    </button>
                </form>
            </div>

            <div id="skillGapResult" class="skill-card skill-result">
                <h2>Your Skill Gap Report</h2>
                <p>
                    Submit the form to view missing skills and personalized
                    recommendations for your target job role.
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
