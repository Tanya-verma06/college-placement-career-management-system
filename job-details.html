
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerNova | Job Details</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
        }

        .job-nav {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
        }

        .job-logo {
            color: #4f46e5;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
        }

        .job-links {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .job-links a {
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .job-links a:hover {
            color: #4f46e5;
        }

        .job-logout {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 10px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .job-container {
            width: 86%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .job-details-card,
        .job-application-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 5px 22px rgba(15, 23, 42, 0.06);
            margin-bottom: 25px;
        }

        .job-details-card {
            border-top: 5px solid #6366f1;
        }

        .job-details-card h1 {
            color: #172554;
            font-size: 32px;
            margin: 0 0 15px;
        }

        .job-details-card h2 {
            color: #334155;
            font-size: 20px;
            margin-top: 28px;
        }

        .job-details-card p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
        }

        .job-application-card h2 {
            color: #1e293b;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .job-form label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        .job-form label:first-child {
            margin-top: 0;
        }

        .job-form input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            font-size: 14px;
            color: #334155;
            outline: none;
        }

        .job-form input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .job-submit {
            width: 100%;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }

        .job-submit:hover {
            background: #4338ca;
        }

        .job-message {
            margin-top: 15px;
            font-size: 14px;
            color: #475569;
        }

        @media (max-width: 768px) {
            .job-nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .job-links {
                gap: 14px;
            }

            .job-container {
                width: 92%;
                margin-top: 30px;
            }

            .job-details-card,
            .job-application-card {
                padding: 23px;
            }

            .job-details-card h1 {
                font-size: 27px;
            }
        }
    </style>
</head>
<body>

    <header class="job-nav">
        <a href="dashboard.html" class="job-logo">CareerNova</a>

        <nav class="job-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="career.html">Career</a>
            <a href="profile.html">Profile</a>
            <button id="logoutBtn" class="job-logout">Logout</button>
        </nav>
    </header>

    <main class="job-container">
        <section id="jobDetails" class="job-details-card">
            <p>Loading job details...</p>
        </section>

        <section class="job-application-card">
            <h2>Apply for This Job</h2>

            <form id="applicationForm" class="job-form">
                <label for="applicantName">Full Name</label>
                <input type="text" id="applicantName" placeholder="Enter your full name" required>

                <label for="applicantEmail">Email Address</label>
                <input type="email" id="applicantEmail" placeholder="Enter your email address" required>

                <label for="applicantResume">Resume Link</label>
                <input type="url" id="applicantResume" placeholder="Paste your resume link" required>

                <button type="submit" class="job-submit">
                    Submit Application
                </button>

                <p id="applicationMessage" class="job-message"></p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
